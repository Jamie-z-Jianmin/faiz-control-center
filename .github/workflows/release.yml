name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Syntax check shell scripts
        run: |
          bash -n install.sh
          bash -n docs/site/install.sh
          bash -n scripts/statusline.sh
          bash -n bin/faiz-dash
          bash -n bin/_faiz_dash_hook.sh

      - name: Install runtime test dependencies & run unittest suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install "textual>=8.0.0" "rich>=13.0.0"
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build wheel & sdist and verify package data
        run: |
          python -m pip install build
          python -m build
          python -c "import zipfile, glob; whl=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(whl).namelist(); assert any(n.endswith('faiz_dash/ui/styles.tcss') for n in names), 'styles.tcss missing from wheel'"
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            docs/site/install.sh
